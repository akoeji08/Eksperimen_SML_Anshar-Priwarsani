name: Automated Data Preprocessing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Run automated preprocessing script
        run: |
          python preprocessing/automate_Anshar-Priwarsani.py

      - name: Upload preprocessed dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: telco-churn-preprocessed
          path: preprocessing/telco_churn_preprocessing/telco_churn_clean.csv

      - name: Commit and push updated preprocessed dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/telco_churn_preprocessing/telco_churn_clean.csv
          git diff --staged --quiet || git commit -m "Auto-update preprocessed dataset via GitHub Actions"
          git push
